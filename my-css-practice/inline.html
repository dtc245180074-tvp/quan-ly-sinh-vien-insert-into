<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Phần 1 - Inline CSS</title>
</head>
<body>

    <!-- Định dạng màu xanh lá (green) cho h1 và màu xanh dương (blue) cho p -->
    <h1 style="color: green;">This is heading 1</h1>
    
    <p style="color: blue;">
        This is an ordinary paragraph. Notice that this text is blue. The default text color for a page is defined in the body selector.
    </p>

</body>
</html>
