<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sử dụng các thuộc tính CSS</title>
    <style>
        /* CSS cho thẻ h1 */
        h1 {
            color: blue;
            font-family: Tahoma, sans-serif;
            font-size: 200%;
        }

        /* CSS chung cho thẻ p */
        p {
            color: red;
            font-family: Arial, sans-serif;
            font-size: 120%;
            border: 1px solid grey;
            padding: 10px;
        }

        /* CSS riêng cho thẻ có id="element1" */
        #element1 {
            color: blue;
        }
    </style>
</head>
<body>

<h1>Đây là đề mục</h1>

<p>Đây là đoạn văn bản.</p>
<p>Đây là đoạn văn bản.</p>
<p>Đây là đoạn văn bản.</p>
<p id="element1">Đoạn văn bản có thuộc tính id</p>

</body>
</html>
